apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: incident-agent-read-config
  namespace: monitoring
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: incident-agent-read-config
  namespace: monitoring
subjects:
  - kind: ServiceAccount
    name: incident-agent
    namespace: monitoring
roleRef:
  kind: Role
  name: incident-agent-read-config
  apiGroup: rbac.authorization.k8s.io
