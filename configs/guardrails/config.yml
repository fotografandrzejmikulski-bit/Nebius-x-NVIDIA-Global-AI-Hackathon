colang_version: "2.x"

models:
  - type: main
    engine: openai
    model: nvidia/nemotron-3-super-120b-a12b
    parameters:
      base_url: ${NEBIUS_BASE_URL}

rails:
  input:
    flows:
      - check user input
  output:
    flows:
      - check model output
  execution:
    flows:
      - check tool input
      - check tool output
