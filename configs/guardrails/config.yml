colang_version: "1.0"

models:
  - type: main
    engine: openai
    model: nvidia/nemotron-3-super-120b-a12b
    parameters:
      base_url: ${NEBIUS_BASE_URL}

rails:
  input:
    flows:
      - jailbreak detection heuristics
      - self check input
  output:
    flows:
      - self check output
  execution:
    flows:
      - check tool input
      - check tool output

config:
  jailbreak_detection:
    length_per_perplexity_threshold: 89.79
    prefix_suffix_perplexity_threshold: 1845.65
